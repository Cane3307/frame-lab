    <div id="cards-grid" class="cards-grid"></div>
    <div id="empty-state" class="empty-state" hidden><svg aria-hidden="true"><use href="#i-smile"/></svg><h2>這個點子，還沒找到。</h2><p>試試其他關鍵字，或看看全部卡片。</p><button id="reset-search" class="button secondary">顯示全部卡片</button></div>
